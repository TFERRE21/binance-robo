<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binance-Robo | Login</title>
</head>

<body>

  <h1>Binance-Robo</h1>
  <h2>Entrar no painel</h2>

  <form id="loginForm">

    <div>
      <label for="email">E-mail</label>
      <input
        type="email"
        id="email"
        name="email"
        required
      >
    </div>

    <br>

    <div>
      <label for="password">Senha</label>
      <input
        type="password"
        id="password"
        name="password"
        required
      >
    </div>

    <br>

    <button type="submit">Entrar</button>

  </form>

  <p id="message"></p>

  <script src="js/login.js"></script>

</body>
</html>
